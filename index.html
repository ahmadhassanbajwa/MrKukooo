<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - Mr KuKOoo</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff9f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(200, 30, 30, 0.1);
            max-width: 550px;
            width: 90%;
            border-top: 5px solid #d8232a;
        }
        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #d8232a;
            font-size: 28px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f29c1f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo referenced verbatim as requested -->
        <img src="logo.png" alt="Mr KuKOoo Logo" class="logo">
        
        <h1>We'll be right back!</h1>
        <p>Our system is currently undergoing scheduled maintenance so we can serve you better. We're working hard to get things back up and running.</p>
        <p>Hang tight! We'll be ready to take your pizza and burger orders again shortly.</p>
        
        <div class="loader"></div>
    </div>
</body>
</html>
